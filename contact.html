<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="お家.comへのお問い合わせ。仲介手数料のお見積もりや住宅診断についてご相談いただけます。">
  <title>お問い合わせ｜お家.com</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">お家.com</a>
    <a class="back-link" href="index.html">トップページへ戻る</a>
  </header>

  <main class="contact-main">
    <section class="intro">
      <p class="eyebrow">CONTACT</p>
      <h1>お問い合わせ・<br>お見積もり</h1>
      <p>仲介手数料や住宅診断についてのご相談を承ります。物件がお決まりの場合は、物件ページのURLもお知らせください。</p>
    </section>

    <section class="form-section">
      <h2>ご相談内容をご入力ください</h2>
      <p class="form-lead">内容を確認のうえ、メールにてご連絡いたします。</p>

      <form action="https://formspree.io/f/mppdazer" method="POST">
        <input type="hidden" name="_subject" value="お家.com｜お問い合わせ">

        <div class="field">
          <label for="name">お名前 <span class="optional">任意</span></label>
          <input id="name" name="お名前" type="text" autocomplete="name" placeholder="お名前">
        </div>

        <div class="field">
          <label for="email">メールアドレス <span class="required">必須</span></label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="example@example.com" required>
        </div>

        <div class="field">
          <label for="phone">電話番号 <span class="optional">任意</span></label>
          <input id="phone" name="電話番号" type="tel" autocomplete="tel" placeholder="電話番号">
        </div>

        <div class="field">
          <label for="inquiry">お問い合わせ項目 <span class="required">必須</span></label>
          <select id="inquiry" name="お問い合わせ項目" required>
            <option value="" selected disabled>選択してください</option>
            <option value="ご相談・ご質問">ご相談・ご質問</option>
            <option value="仲介手数料見積り">仲介手数料のお見積もり</option>
            <option value="欠陥住宅チェックリスト">住宅診断・チェックリスト</option>
          </select>
        </div>

        <div class="field">
          <label for="property-url">物件URL <span class="optional">任意</span></label>
          <input id="property-url" name="物件URL" type="url" placeholder="物件ページのURL">
          <p class="field-note">仲介手数料のお見積もりをご希望の場合、物件URLがあると確認がスムーズです。</p>
        </div>

        <div class="field">
          <label for="message">ご相談内容 <span class="required">必須</span></label>
          <textarea id="message" name="お問い合わせ内容" rows="5" placeholder="ご相談内容をご入力ください" required></textarea>
        </div>

        <button class="submit-button" type="submit">送信する <span aria-hidden="true">→</span></button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand">お家.com</div>
    <p>住まい探しと建物の確認をサポートします。</p>
    <nav class="footer-links" aria-label="フッターナビゲーション">
      <a href="service.html">不動産仲介</a>
      <a href="idea.html">理念</a>
      <a href="voice.html">お客様の声</a>
      <a href="company.html">会社概要</a>
    </nav>
    <a class="footer-contact" href="index.html">トップページへ戻る</a>
    <small>© 2026 お家.com All Rights Reserved.</small>
  </footer>
</body>
</html>
