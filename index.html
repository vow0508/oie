<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お家.com</title>

<style>

body{
    margin:0;
    font-family: "Yu Gothic","Meiryo",sans-serif;
    background:#ffffff;
    text-align:center;
}

.hero{
    max-width:1200px;
    margin:auto;
    min-height:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:60px;
    padding:60px;
}

.hero-text{
    flex:1;
    text-align:left;
}

.hero-text h1{
    font-size:56px;
    line-height:1.3;
    margin-bottom:25px;
}

.hero-text p{
    font-size:22px;
    color:#666;
    line-height:1.8;
}

.hero-image{
    flex:1;
}

.hero-image img{
    width:100%;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.15);
}


h1{
    font-size:70px;
    margin:0;
}

p{
    font-size:28px;
    color:#666;
}



    
header img{
    width:180px;
    display:block;
    margin-top:50px;
    margin-left:40px;
}
 

 


nav a{
    margin-left:35px;
    text-decoration:none;
    color:#333;
    font-weight:600;
}


header{
    max-width:1100px;
    margin:30px auto 0;
    padding:0 20px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.logo{
    width:170px;
}

nav{
    padding-top:70px;
}


.btn{
    display:inline-block;
    margin-top:40px;
    padding:20px 48px;
    background:#1b7f3b;
    color:#fff;
    text-decoration:none;
    border-radius:40px;
    font-size:22px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    background:#14642e;
}


@media (max-width:768px){

header{
    flex-direction:column;
    align-items:center;
    padding:20px;
}

nav{
    padding-top:20px;
}

.hero{
    flex-direction:column;
    padding:30px 20px;
    gap:30px;
}

.hero-text{
    order:2;
    text-align:center;
}

.hero-image{
    order:1;
}

.hero-text h1{
    font-size:42px;
}

.hero-text p{
    font-size:18px;
}

.hero-image img{
    width:100%;
}

.btn{
    width:100%;
    max-width:320px;
    margin:auto;
}
}



    
    
</style>

</head>

<body>






<header>

    <img src="logo.jpg" class="logo" alt="お家.com">

    <nav>
        <a href="#">HOME</a>
        <a href="#">SERVICE</a>
        <a href="#">ABOUT</a>
        <a href="#">CONTACT</a>
    </nav>

</header>

<section class="hero">



   
   <div class="hero-text">

        <h1>
        いい住まい選びは、<br>
        いい専門家選びから。
        </h1>

        <p>
        宅地建物取引士と建築士のダブルライセンスで、
        あなたと一緒に内覧に同行します。<br><br>

        三井グループで培った建物調査の経験を活かし。<br>

        建物を見るプロの視点で、<br>
        あなたの住まい選びをサポートします。<br>
        </p>

<a href="#" class="btn">専門家に相談する</a>
       
    </div>

    <div class="hero-image">

        <img src="papadbc2.png" alt="建築士による建物調査">

    </div>

</section>

</body>
</html>
